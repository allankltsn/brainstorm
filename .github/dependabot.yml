version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /init
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /prototype-v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /aura-brand
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # aura-landing tem pnpm-lock.yaml (e package-lock.json); o ecossistema "npm" do Dependabot cobre pnpm.
  - package-ecosystem: npm
    directory: /aura-landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
