<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIS-04 · Manutenção · aura-fit</title>
  <meta name="aura-screen" content="SIS-04">
  <meta name="aura-variants" content="sem-previsao">
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="../../assets/components.css">
  <link rel="stylesheet" href="../../assets/shell.css">
  <link rel="stylesheet" href="../../assets/grupo-g1.css">
  <script src="../../assets/icons.js"></script>
  <script src="../../assets/data.js"></script>
  <script src="../../assets/data-g1.js"></script>
  <script src="../../assets/shell.js"></script>
</head>
<body class="g1">
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<div class="g1-page">
  <header class="g1-pubbar">
    <a class="g1-wordmark" href="../auth/login.html" aria-label="aura-fit, ir para a entrada">aura-<span>fit</span></a>
    <div class="g1-pubbar-actions">
      
      <button type="button" class="g1-iconbtn" data-g1-theme aria-label="Mudar tema"></button>
    </div>
  </header>
  <main id="conteudo" tabindex="-1" class="g1-center" data-state="default">
    <div class="g1-card g1-card-wide">
        <div id="g1-state" data-when="loading error"></div>
      <div data-when="default empty success">
        <div class="g1-statecard">
          <span class="g1-bigicon is-warning"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg></span>
          <h1>Estamos fazendo uma melhoria</h1>
          <p data-vnot="sem-previsao"><strong id="retorno">Voltamos hoje às 14h.</strong></p>
          <p data-v="sem-previsao" hidden><strong>Ainda não temos um horário para voltar.</strong> Atualizamos esta página assim que soubermos.</p>
          <div class="alert alert-success" role="note"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lock"/></svg><div class="alert-body"><strong>Seus dados estão seguros.</strong> Nada foi perdido nem alterado.</div></div>
          <p class="muted">Precisa falar com a gente? Escreva para <a href="mailto:suporte@exemplo.com.br">suporte@exemplo.com.br</a>.</p>
          <div class="g1-actions"><button type="button" class="btn btn-secondary btn-block" id="atualizar"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg>Atualizar a página</button></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../assets/grupo-g1.js"></script>
<script>
(function () {
  var t = window.AURA.maintenance && window.AURA.maintenance.returnAt;
  if (t) {
    var d = new Date(t), h = d.getHours(), m = d.getMinutes(), hoje = d.toDateString() === new Date(2026, 9, 16).toDateString();
    var hora = h + 'h' + (m ? (m < 10 ? '0' : '') + m : '');
    document.getElementById('retorno').textContent = 'Voltamos ' + (hoje ? 'hoje' : 'em ' + window.AURA.fmtDate(t)) + ' às ' + hora + '.';
  }
  document.getElementById('atualizar').addEventListener('click', function () { location.reload(); });
})();
</script>
</body>
</html>
