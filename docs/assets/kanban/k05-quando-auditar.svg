<svg xmlns="http://www.w3.org/2000/svg" width="1198" height="412" viewBox="0 0 1198 412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quando o quadro é auditado">
<title>Quando o quadro é auditado</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1198" height="412" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Quando o quadro é auditado</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Cinco momentos fixos; em cada um fica registrada uma linha com cards conferidos, erros, avisos e parados</text>
<path d="M131.0,212.0 L131.0,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M365.0,212.0 L365.0,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M599.0,212.0 L599.0,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="190" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="131.0" y="136.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Antes de cada</text>
<text x="131.0" y="153.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">passagem</text>
<text x="131.0" y="171.5" font-size="11" fill="#94a3b8" text-anchor="middle">o card já deve cumprir as</text>
<text x="131.0" y="185.5" font-size="11" fill="#94a3b8" text-anchor="middle">condições do estado de</text>
<text x="131.0" y="199.5" font-size="11" fill="#94a3b8" text-anchor="middle">destino</text>
<rect x="270" y="116" width="190" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="365.0" y="143.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Início ou retomada</text>
<text x="365.0" y="160.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">da sessão</text>
<text x="365.0" y="178.5" font-size="11" fill="#94a3b8" text-anchor="middle">nada começa com o quadro</text>
<text x="365.0" y="192.5" font-size="11" fill="#94a3b8" text-anchor="middle">desatualizado</text>
<rect x="504" y="116" width="190" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="599.0" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Fim de cada onda</text>
<text x="599.0" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">depois de um conjunto de</text>
<text x="599.0" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">entregas</text>
<rect x="738" y="116" width="190" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="833.0" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ao gravar um handoff</text>
<text x="833.0" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">o registro e o quadro</text>
<text x="833.0" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">precisam concordar</text>
<rect x="972" y="116" width="190" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1067.0" y="143.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Antes de um portão</text>
<text x="1067.0" y="160.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">seu</text>
<text x="1067.0" y="178.5" font-size="11" fill="#94a3b8" text-anchor="middle">você decide olhando um</text>
<text x="1067.0" y="192.5" font-size="11" fill="#94a3b8" text-anchor="middle">quadro verdadeiro</text>
<rect x="36" y="252" width="658" height="96" rx="11" fill="#3a1230" stroke="#f472b6" stroke-width="1.6"/>
<text x="365.0" y="295.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Auditor do quadro</text>
<text x="365.0" y="313.0" font-size="11" fill="#94a3b8" text-anchor="middle">25 regras fixas, sem IA: mesmo resultado para o mesmo quadro</text>
<rect x="738" y="252" width="424" height="96" rx="11" fill="#3a1230" stroke="#f472b6" stroke-width="1.6"/>
<text x="950.0" y="295.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Despacho exige card</text>
<text x="950.0" y="313.0" font-size="11" fill="#94a3b8" text-anchor="middle">hook nega chamar um agente sem a linha Card: dono/repo#N</text>

<rect x="36" y="373" width="12" height="12" rx="3" fill="#251b47" stroke="#a78bfa" stroke-width="1.4"/>
<text x="54" y="383" font-size="10.5" fill="#94a3b8">segurança e gates</text>
<rect x="177.745" y="373" width="12" height="12" rx="3" fill="#3a1230" stroke="#f472b6" stroke-width="1.4"/>
<text x="195.745" y="383" font-size="10.5" fill="#94a3b8">criado nesta versão</text>

</svg>
