<svg xmlns="http://www.w3.org/2000/svg" width="1198" height="460" viewBox="0 0 1198 460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="O ciclo de cobrança">
<title>O ciclo de cobrança</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1198" height="460" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">O ciclo de cobrança</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Os agentes não conversam entre si: tudo passa pelo principal, e o auditor decide o que está pendente</text>
<path d="M226.0,168.0 L270.0,168.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M460.0,168.0 L504.0,168.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M694.0,168.0 L738.0,168.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M928.0,168.0 L972.0,168.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M365.0,220.0 L365.0,264.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M833.0,220.0 L833.0,264.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M1067.0,220.0 L1067.0,264.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="190" height="104" rx="11" fill="#3a1230" stroke="#f472b6" stroke-width="1.6"/>
<text x="131.0" y="163.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Scrum Master</text>
<text x="131.0" y="181.0" font-size="11" fill="#94a3b8" text-anchor="middle">roda o auditor do quadro</text>
<rect x="270" y="116" width="190" height="104" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="365.0" y="149.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Relatório</text>
<text x="365.0" y="167.0" font-size="11" fill="#94a3b8" text-anchor="middle">pendências por</text>
<text x="365.0" y="181.0" font-size="11" fill="#94a3b8" text-anchor="middle">responsável, com o ID da</text>
<text x="365.0" y="195.0" font-size="11" fill="#94a3b8" text-anchor="middle">regra</text>
<rect x="504" y="116" width="190" height="104" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="599.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Principal</text>
<text x="599.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">devolve cada pendência ao</text>
<text x="599.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">dono</text>
<rect x="738" y="116" width="190" height="104" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="833.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Responsável corrige</text>
<text x="833.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">product-owner, executor ou</text>
<text x="833.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">validador</text>
<rect x="972" y="116" width="190" height="104" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1067.0" y="149.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Nova auditoria</text>
<text x="1067.0" y="167.0" font-size="11" fill="#94a3b8" text-anchor="middle">a pendência só fecha</text>
<text x="1067.0" y="181.0" font-size="11" fill="#94a3b8" text-anchor="middle">quando o script para de</text>
<text x="1067.0" y="195.0" font-size="11" fill="#94a3b8" text-anchor="middle">apontar</text>
<rect x="270" y="264" width="190" height="104" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="365.0" y="304.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Correção mecânica</text>
<text x="365.0" y="322.0" font-size="11" fill="#94a3b8" text-anchor="middle">o script ajusta os campos</text>
<text x="365.0" y="336.0" font-size="11" fill="#94a3b8" text-anchor="middle">derivados</text>
<rect x="738" y="264" width="190" height="104" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="833.0" y="304.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Card parado</text>
<text x="833.0" y="322.0" font-size="11" fill="#94a3b8" text-anchor="middle">com erro aberto, o card</text>
<text x="833.0" y="336.0" font-size="11" fill="#94a3b8" text-anchor="middle">não muda de status</text>
<rect x="972" y="264" width="190" height="104" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="1067.0" y="311.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Passagem liberada</text>
<text x="1067.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">o card pode andar</text>

<rect x="36" y="393" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="403" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="393" width="12" height="12" rx="3" fill="#0e2340" stroke="#60a5fa" stroke-width="1.4"/>
<text x="183.77499999999998" y="403" font-size="10.5" fill="#94a3b8">ferramenta externa</text>
<rect x="313.505" y="393" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="331.505" y="403" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="443.28" y="393" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="461.28" y="403" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="579.04" y="393" width="12" height="12" rx="3" fill="#251b47" stroke="#a78bfa" stroke-width="1.4"/>
<text x="597.04" y="403" font-size="10.5" fill="#94a3b8">segurança e gates</text>
<rect x="720.785" y="393" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="738.785" y="403" font-size="10.5" fill="#94a3b8">resultado</text>
<rect x="814.65" y="393" width="12" height="12" rx="3" fill="#3a1230" stroke="#f472b6" stroke-width="1.4"/>
<text x="832.65" y="403" font-size="10.5" fill="#94a3b8">criado nesta versão</text>
<text x="36" y="426" font-size="11" fill="#94a3b8">Mecânico é o que decorre de outro dado do card (Etapa, Precisa de você, Gates). Conteúdo é prova ou decisão: o Scrum Master nunca preenche, para não inventar evidência.</text>
</svg>
