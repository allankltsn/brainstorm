<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="424" viewBox="0 0 1216 424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="RTK: comprime a saída dos comandos de shell">
<title>RTK: comprime a saída dos comandos de shell</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1216" height="424" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">RTK: comprime a saída dos comandos de shell</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Um hook reescreve o comando de Bash; só o essencial da saída chega ao modelo</text>
<path d="M228.0,167.0 L274.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M466.0,167.0 L512.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M704.0,167.0 L750.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M942.0,167.0 L988.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="192" height="102" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="132.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Claude Code</text>
<text x="132.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">chama a ferramenta Bash</text>
<rect x="274" y="116" width="192" height="102" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="370.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Hook PreToolUse</text>
<text x="370.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">instalado com rtk init -g</text>
<text x="370.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">em settings.json</text>
<rect x="512" y="116" width="192" height="102" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="608.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Comando roda</text>
<text x="608.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">git, npm, ls, cargo, testes</text>
<rect x="750" y="116" width="192" height="102" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="846.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">RTK filtra</text>
<text x="846.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">remove ruído e repetição da</text>
<text x="846.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">saída</text>
<rect x="988" y="116" width="192" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="1084.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Modelo recebe</text>
<text x="1084.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">versão compacta da saída</text>
<rect x="36" y="258" width="430" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="251.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ganho</text>
<text x="251.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Reduz tokens de saída de mais de 100 comandos comuns. O projeto</text>
<text x="251.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">alega de 60% a 90%, medido em cenários próprios.</text>
<rect x="512" y="258" width="668" height="102" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="846.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Cuidado</text>
<text x="846.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Read, Grep e Glob nativos não passam pelo hook de Bash, então não são comprimidos. Existe outro pacote</text>
<text x="846.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">chamado rtk no crates.io, sem relação: instale pelo repositório rtk-ai.</text>

