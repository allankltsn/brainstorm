<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="452" viewBox="0 0 1216 452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Serena: leitura e edição de código por símbolo">
<title>Serena: leitura e edição de código por símbolo</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1216" height="452" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Serena: leitura e edição de código por símbolo</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Servidor MCP com servidor de linguagem (LSP): devolve o trecho certo, não o arquivo inteiro</text>
<path d="M228.0,167.0 L274.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M466.0,167.0 L512.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M704.0,167.0 L750.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M942.0,167.0 L988.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="192" height="102" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="132.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Claude Code</text>
<text x="132.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">pergunta onde está a função</text>
<text x="132.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">X</text>
<rect x="274" y="116" width="192" height="102" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="370.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">MCP Serena</text>
<text x="370.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">processo local via stdio</text>
<text x="370.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">(uvx)</text>
<rect x="512" y="116" width="192" height="102" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="608.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Language server</text>
<text x="608.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">LSP do TypeScript do</text>
<text x="608.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">projeto</text>
<rect x="750" y="116" width="192" height="102" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="846.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Índice de símbolos</text>
<text x="846.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">definições e referências</text>
<rect x="988" y="116" width="192" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="1084.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Resposta mínima</text>
<text x="1084.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">só o trecho e quem o usa</text>
<rect x="36" y="258" width="430" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="251.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ganho</text>
<text x="251.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Evita ler arquivos inteiros e permite editar por símbolo. O</text>
<text x="251.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">efeito é maior em código grande.</text>
<rect x="512" y="258" width="668" height="102" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="846.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Cuidado</text>
<text x="846.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Servidor de linguagem vazio não prova que funciona. Ativar exige confiar no projeto. Não copiar</text>
<text x="846.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">memórias, caches nem configurações globais pessoais.</text>

<rect x="36" y="385" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="395" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="385" width="12" height="12" rx="3" fill="#0e2340" stroke="#60a5fa" stroke-width="1.4"/>
<text x="183.77499999999998" y="395" font-size="10.5" fill="#94a3b8">ferramenta externa</text>
<rect x="313.505" y="385" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="331.505" y="395" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="443.28" y="385" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="461.28" y="395" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="579.04" y="385" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="597.04" y="395" font-size="10.5" fill="#94a3b8">resultado</text>
<text x="36" y="418" font-size="11" fill="#94a3b8">Complementa o RTK: o RTK cuida da saída do shell, o Serena da leitura de código.</text>
</svg>
