<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="424" viewBox="0 0 1216 424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="GitHub e Projects: o quadro como registro durável">
<title>GitHub e Projects: o quadro como registro durável</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1216" height="424" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">GitHub e Projects: o quadro como registro durável</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Toda tarefa é uma issue no repositório certo, agrupada em um Project; sub-issues ligam história e tarefas</text>
<path d="M228.0,167.0 L274.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M466.0,167.0 L512.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M704.0,167.0 L750.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M942.0,167.0 L988.0,167.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="192" height="102" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="132.0" y="146.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Principal cria</text>
<text x="132.0" y="163.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">issues</text>
<text x="132.0" y="181.5" font-size="11" fill="#94a3b8" text-anchor="middle">história, sub-issues e</text>
<text x="132.0" y="195.5" font-size="11" fill="#94a3b8" text-anchor="middle">checkpoints</text>
<rect x="274" y="116" width="192" height="102" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="370.0" y="162.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">gh CLI ou GitHub MCP</text>
<text x="370.0" y="180.0" font-size="11" fill="#94a3b8" text-anchor="middle">escopos mínimos</text>
<rect x="512" y="116" width="192" height="102" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="608.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Project</text>
<text x="608.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">Status, Priority, Type,</text>
<text x="608.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">Agent, Sprint</text>
<rect x="750" y="116" width="192" height="102" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="846.0" y="155.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Agentes leem a issue</text>
<text x="846.0" y="173.0" font-size="11" fill="#94a3b8" text-anchor="middle">escopo, critérios e próximo</text>
<text x="846.0" y="187.0" font-size="11" fill="#94a3b8" text-anchor="middle">dono</text>
<rect x="988" y="116" width="192" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="1084.0" y="153.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Principal move o</text>
<text x="1084.0" y="170.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">status</text>
<text x="1084.0" y="188.5" font-size="11" fill="#94a3b8" text-anchor="middle">só com evidência</text>
<rect x="36" y="258" width="430" height="102" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="251.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ganho</text>
<text x="251.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Um quadro só para vários repositórios, com sub-issues nativas e</text>
<text x="251.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">histórico auditável.</text>
<rect x="512" y="258" width="668" height="102" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="846.0" y="297.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Cuidado</text>
<text x="846.0" y="315.0" font-size="11" fill="#94a3b8" text-anchor="middle">Token com escopo mínimo e nunca em issue ou log. Automações de Status do próprio GitHub ficam</text>
<text x="846.0" y="329.0" font-size="11" fill="#94a3b8" text-anchor="middle">desligadas. O GitHub não impede quem move o cartão: o principal audita o histórico.</text>

<rect x="36" y="385" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="395" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="385" width="12" height="12" rx="3" fill="#0e2340" stroke="#60a5fa" stroke-width="1.4"/>
<text x="183.77499999999998" y="395" font-size="10.5" fill="#94a3b8">ferramenta externa</text>
<rect x="313.505" y="385" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="331.505" y="395" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="443.28" y="385" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="461.28" y="395" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="579.04" y="385" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="597.04" y="395" font-size="10.5" fill="#94a3b8">resultado</text>

</svg>
