<text x="685.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">o principal passa o contrato</text>
<text x="685.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">do guilda no briefing</text>
<rect x="849" y="116" width="215" height="96" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="956.5" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Gates independentes</text>
<text x="956.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">ao menos um de fonte diferente</text>
<text x="956.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">da do autor</text>
<rect x="307" y="258" width="215" height="96" rx="11" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="414.5" y="294.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Existe papel do guilda?</text>
<text x="414.5" y="312.0" font-size="11" fill="#94a3b8" text-anchor="middle">o próprio papel ou a reserva</text>
<text x="414.5" y="326.0" font-size="11" fill="#94a3b8" text-anchor="middle">indicada</text>
