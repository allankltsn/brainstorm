<text x="685.5" y="327.5" font-size="11" fill="#94a3b8" text-anchor="middle">contrato canônico</text>
<rect x="307" y="400" width="215" height="96" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="414.5" y="436.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Lacuna registrada</text>
<text x="414.5" y="454.0" font-size="11" fill="#94a3b8" text-anchor="middle">nunca trocar por um papel</text>
<text x="414.5" y="468.0" font-size="11" fill="#94a3b8" text-anchor="middle">parecido</text>
