<text x="685.5" y="462.5" font-size="11" fill="#94a3b8" text-anchor="middle">com revisão de segurança e sua</text>
<text x="685.5" y="476.5" font-size="11" fill="#94a3b8" text-anchor="middle">aprovação</text>
