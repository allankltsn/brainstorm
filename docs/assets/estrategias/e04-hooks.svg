<svg xmlns="http://www.w3.org/2000/svg" width="1222" height="600" viewBox="0 0 1222 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Proteção técnica: o que acontece a cada ação do agente">
<title>Proteção técnica: o que acontece a cada ação do agente</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1222" height="600" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Proteção técnica: o que acontece a cada ação do agente</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Vale para as duas versões: na v0 os hooks estão no plugin nucleo; na v1, no mod guardrails</text>
<path d="M226.0,166.0 L276.0,166.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M706.0,166.0 L756.0,166.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M946.0,166.0 L996.0,166.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
