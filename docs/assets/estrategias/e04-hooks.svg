<path d="M611.0,362.0 L611.0,408.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M1091.0,362.0 L1091.0,408.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="190" height="100" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="131.0" y="154.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Agente pede uma ação</text>
<text x="131.0" y="172.0" font-size="11" fill="#94a3b8" text-anchor="middle">Bash, Read, Write,</text>
<text x="131.0" y="186.0" font-size="11" fill="#94a3b8" text-anchor="middle">Agent...</text>
<rect x="276" y="116" width="430" height="100" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="491.0" y="161.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Hooks antes da ação</text>
<text x="491.0" y="179.0" font-size="11" fill="#94a3b8" text-anchor="middle">guarda de comandos, guarda de arquivos e orçamento da sessão</text>
<rect x="756" y="116" width="190" height="100" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="851.0" y="161.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ação executa</text>
<text x="851.0" y="179.0" font-size="11" fill="#94a3b8" text-anchor="middle">quando nada barra</text>
<rect x="996" y="116" width="190" height="100" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1091.0" y="161.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Hook depois da ação</text>
<text x="1091.0" y="179.0" font-size="11" fill="#94a3b8" text-anchor="middle">só após web ou MCP</text>
<rect x="36" y="262" width="190" height="100" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="131.0" y="291.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Motivo volta ao</text>
<text x="131.0" y="308.5" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">agente</text>
<text x="131.0" y="326.5" font-size="11" fill="#94a3b8" text-anchor="middle">ele deve relatar, não</text>
<text x="131.0" y="340.5" font-size="11" fill="#94a3b8" text-anchor="middle">contornar</text>
<rect x="276" y="262" width="190" height="100" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="371.0" y="307.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Negar</text>
<text x="371.0" y="325.0" font-size="11" fill="#94a3b8" text-anchor="middle">a ação não acontece</text>
<rect x="516" y="262" width="190" height="100" rx="11" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="611.0" y="307.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Perguntar a você</text>
<text x="611.0" y="325.0" font-size="11" fill="#94a3b8" text-anchor="middle">confirmação na tela</text>
<rect x="996" y="262" width="190" height="100" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="1091.0" y="300.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Sessão marcada</text>
<text x="1091.0" y="318.0" font-size="11" fill="#94a3b8" text-anchor="middle">alerta se houver padrão de</text>
<text x="1091.0" y="332.0" font-size="11" fill="#94a3b8" text-anchor="middle">prompt injection</text>
<rect x="36" y="408" width="430" height="100" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="251.0" y="439.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">O que é negado</text>
<text x="251.0" y="457.0" font-size="11" fill="#94a3b8" text-anchor="middle">rm -r em alvo amplo, push em ramo protegido ou forçado,</text>
<text x="251.0" y="471.0" font-size="11" fill="#94a3b8" text-anchor="middle">--no-verify, curl | sh, ler .env e chaves, gravar segredo, teto</text>
<text x="251.0" y="485.0" font-size="11" fill="#94a3b8" text-anchor="middle">de chamadas, loop</text>
<rect x="516" y="408" width="430" height="100" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="731.0" y="446.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">O que pede confirmação</text>
<text x="731.0" y="464.0" font-size="11" fill="#94a3b8" text-anchor="middle">kubectl, helm, terraform, deploy, migração, publish, merge, ssh,</text>
<text x="731.0" y="478.0" font-size="11" fill="#94a3b8" text-anchor="middle">aprovar portão e renovar orçamento</text>
<rect x="996" y="408" width="190" height="100" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1091.0" y="446.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Efeito</text>
<text x="1091.0" y="464.0" font-size="11" fill="#94a3b8" text-anchor="middle">comandos de produção</text>
<text x="1091.0" y="478.0" font-size="11" fill="#94a3b8" text-anchor="middle">ganham aviso reforçado</text>
<rect x="742.6" y="303.0" width="71.8" height="18" rx="9" fill="#0b1220" stroke="#64748b" stroke-width="0.8"/>
<text x="778.5" y="316.0" font-size="10.5" fill="#e2e8f0" text-anchor="middle">se aprovar</text>
<rect x="36" y="533" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="54" y="543" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="165.77499999999998" y="533" width="12" height="12" rx="3" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.4"/>
<text x="183.77499999999998" y="543" font-size="10.5" fill="#94a3b8">decisão humana</text>
<rect x="289.56499999999994" y="533" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="307.56499999999994" y="543" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="425.32499999999993" y="533" width="12" height="12" rx="3" fill="#251b47" stroke="#a78bfa" stroke-width="1.4"/>
<text x="443.32499999999993" y="543" font-size="10.5" fill="#94a3b8">segurança e gates</text>
<rect x="567.0699999999999" y="533" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="585.0699999999999" y="543" font-size="10.5" fill="#94a3b8">resultado</text>
<text x="36" y="566" font-size="11" fill="#94a3b8">Os hooks são uma barreira, não um sandbox: um comando ofuscado pode escapar. Menor privilégio e aprovação humana para produção continuam necessários.</text>
</svg>
