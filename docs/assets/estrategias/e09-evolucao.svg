<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="412" viewBox="0 0 1100 412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Como as duas versões se complementam">
<title>Como as duas versões se complementam</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="412" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Como as duas versões se complementam</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">A v0 serve para experimentar; a v1 para padronizar; o que funcionar pode ser promovido ao guilda</text>
<path d="M251.0,164.0 L307.0,164.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M522.0,164.0 L578.0,164.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M793.0,164.0 L849.0,164.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M143.5,212.0 L143.5,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M414.5,212.0 L414.5,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M685.5,212.0 L685.5,252.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="215" height="96" rx="11" fill="#3a1230" stroke="#f472b6" stroke-width="1.6"/>
<text x="143.5" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">v0: experimentar</text>
<text x="143.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">leve e sem dependência; boa</text>
<text x="143.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">para testar hooks e agentes</text>
<rect x="307" y="116" width="215" height="96" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="414.5" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">v1: padronizar</text>
<text x="414.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">governança do guilda com</text>
<text x="414.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">externo primeiro</text>
<rect x="578" y="116" width="215" height="96" rx="11" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="685.5" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Promover</text>
<text x="685.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">o que funcionar vira proposta</text>
<text x="685.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">ao guilda</text>
<rect x="849" y="116" width="215" height="96" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="956.5" y="152.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">guilda v3</text>
<text x="956.5" y="170.0" font-size="11" fill="#94a3b8" text-anchor="middle">um só lugar; a atualização</text>
<text x="956.5" y="184.0" font-size="11" fill="#94a3b8" text-anchor="middle">oficial volta a valer</text>
<rect x="36" y="252" width="215" height="96" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="143.5" y="288.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Medir</text>
<text x="143.5" y="306.0" font-size="11" fill="#94a3b8" text-anchor="middle">tokens, retrabalho e falsos</text>
<text x="143.5" y="320.0" font-size="11" fill="#94a3b8" text-anchor="middle">positivos dos hooks</text>
<rect x="307" y="252" width="215" height="96" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="414.5" y="288.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Validar</text>
<text x="414.5" y="306.0" font-size="11" fill="#94a3b8" text-anchor="middle">em um projeto real, antes de</text>
<text x="414.5" y="320.0" font-size="11" fill="#94a3b8" text-anchor="middle">promover</text>
<rect x="578" y="252" width="215" height="96" rx="11" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="685.5" y="288.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Você decide</text>
<text x="685.5" y="306.0" font-size="11" fill="#94a3b8" text-anchor="middle">nada é promovido sem a sua</text>
<text x="685.5" y="320.0" font-size="11" fill="#94a3b8" text-anchor="middle">aprovação</text>

<rect x="36" y="373" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="383" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="373" width="12" height="12" rx="3" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.4"/>
<text x="183.77499999999998" y="383" font-size="10.5" fill="#94a3b8">decisão humana</text>
<rect x="289.56499999999994" y="373" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="307.56499999999994" y="383" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="425.32499999999993" y="373" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="443.32499999999993" y="383" font-size="10.5" fill="#94a3b8">resultado</text>
<rect x="519.1899999999999" y="373" width="12" height="12" rx="3" fill="#3a1230" stroke="#f472b6" stroke-width="1.4"/>
<text x="537.1899999999999" y="383" font-size="10.5" fill="#94a3b8">criado nesta versão</text>

