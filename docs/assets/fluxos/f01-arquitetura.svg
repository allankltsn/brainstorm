<text x="414.5" y="429.0" font-size="11" fill="#94a3b8" text-anchor="middle">plugins: VoltAgent, wshobson,</text>
<text x="414.5" y="443.0" font-size="11" fill="#94a3b8" text-anchor="middle">Anthropic, BMAD</text>
