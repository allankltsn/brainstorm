<svg xmlns="http://www.w3.org/2000/svg" width="1198" height="490" viewBox="0 0 1198 490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Do texto ao controle técnico">
<title>Do texto ao controle técnico</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1198" height="490" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Do texto ao controle técnico</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">Cada camada protege contra algo diferente; só as três últimas são enforcement de verdade</text>
<path d="M226.0,175.0 L270.0,175.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M460.0,175.0 L504.0,175.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M694.0,175.0 L738.0,175.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M928.0,175.0 L972.0,175.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="190" height="118" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="131.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">1 Texto</text>
<text x="131.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">regras em markdown.</text>
<text x="131.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">Orienta, não impede. Um</text>
<text x="131.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle">agente pode ignorar</text>
<rect x="121.54000000000002" y="108" width="96.46" height="16" rx="8" fill="#0b1220" stroke="#f87171" stroke-width="1.2"/>
<text x="169.77" y="119.5" font-size="9.5" font-weight="700" fill="#f87171" text-anchor="middle">não é controle</text>
<rect x="270" y="116" width="190" height="118" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="365.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">2 Permissões</text>
<text x="365.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">allow, ask e deny do</text>
<text x="365.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">Claude Code por ferramenta</text>
<text x="365.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle">e caminho</text>
<rect x="504" y="116" width="190" height="118" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="599.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">3 Hooks</text>
<text x="599.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">PreToolUse bloqueia ou</text>
<text x="599.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">reescreve; PostToolUse</text>
<text x="599.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle">escaneia</text>
<rect x="738" y="116" width="190" height="118" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="833.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">4 Ambiente</text>
<text x="833.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">worktree isolada, rede</text>
<text x="833.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">restrita, credenciais de</text>
<text x="833.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle">curta duração</text>
<rect x="972" y="116" width="190" height="118" rx="11" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.6"/>
<text x="1067.0" y="156.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">5 Humano</text>
<text x="1067.0" y="174.0" font-size="11" fill="#94a3b8" text-anchor="middle">aprovação explícita para</text>
<text x="1067.0" y="188.0" font-size="11" fill="#94a3b8" text-anchor="middle">produção, IAM, migração,</text>
<text x="1067.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle">destrutivo</text>
<rect x="36" y="280" width="424" height="118" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="248.0" y="334.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Já existe no guilda</text>
<text x="248.0" y="352.0" font-size="11" fill="#94a3b8" text-anchor="middle">o texto (políticas safety, installations, evidence)</text>
<rect x="504" y="280" width="658" height="118" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="833.0" y="334.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Falta escrever</text>
<text x="833.0" y="352.0" font-size="11" fill="#94a3b8" text-anchor="middle">deny rules, hooks de bloqueio, teto de custo</text>

<rect x="36" y="423" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="433" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="423" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="183.77499999999998" y="433" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="295.54999999999995" y="423" width="12" height="12" rx="3" fill="#3a2b0a" stroke="#fbbf24" stroke-width="1.4"/>
<text x="313.54999999999995" y="433" font-size="10.5" fill="#94a3b8">decisão humana</text>
<rect x="419.3399999999999" y="423" width="12" height="12" rx="3" fill="#251b47" stroke="#a78bfa" stroke-width="1.4"/>
<text x="437.3399999999999" y="433" font-size="10.5" fill="#94a3b8">segurança e gates</text>
<text x="36" y="456" font-size="11" fill="#94a3b8">Exemplos de regras a escrever: negar leitura de .env, negar rm -rf e push em main, exigir aprovação para comandos de produção, bloquear commit com segredo e uso de --no-verify.</text>
</svg>
