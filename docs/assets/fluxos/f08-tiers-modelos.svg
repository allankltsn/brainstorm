<svg xmlns="http://www.w3.org/2000/svg" width="1082" height="726" viewBox="0 0 1082 726" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Camadas de modelo e quando subir ou descer">
<title>Camadas de modelo e quando subir ou descer</title>
<defs><marker id="ar64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1082" height="726" rx="16" fill="#0b1220"/>
<rect x="36" y="28" width="34" height="4" rx="2" fill="#2dd4bf"/>
<text x="36" y="58" font-size="20" font-weight="800" fill="#e2e8f0">Camadas de modelo e quando subir ou descer</text>
<text x="36" y="80" font-size="12.5" fill="#94a3b8">O principal escolhe o tier mais barato que resolve e registra "Model: tier, motivo" no briefing</text>
<path d="M326.0,306.0 L396.0,306.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M686.0,306.0 L756.0,306.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar64748b)"/>
<path d="M181.0,358.0 L181.0,392.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M541.0,358.0 L541.0,392.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>
<path d="M901.0,358.0 L901.0,392.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar64748b)"/>

<rect x="36" y="116" width="1010" height="104" rx="11" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="541.0" y="163.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Sinais para escolher, em ordem</text>
<text x="541.0" y="181.0" font-size="11" fill="#94a3b8" text-anchor="middle">raio de impacto, novidade e ambiguidade, tamanho do contexto, falha anterior, custo do erro versus custo do tier</text>
<rect x="36" y="254" width="290" height="104" rx="11" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.6"/>
<text x="181.0" y="287.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">light</text>
<text x="181.0" y="305.0" font-size="11" fill="#94a3b8" text-anchor="middle">formatar LOG e changelog, índices, resumos</text>
<text x="181.0" y="319.0" font-size="11" fill="#94a3b8" text-anchor="middle">de status, renomear, testes com usuário</text>
<text x="181.0" y="333.0" font-size="11" fill="#94a3b8" text-anchor="middle">leigo simulado</text>
<rect x="396" y="254" width="290" height="104" rx="11" fill="#0e2340" stroke="#60a5fa" stroke-width="1.6"/>
<text x="541.0" y="287.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">standard (padrão)</text>
<text x="541.0" y="305.0" font-size="11" fill="#94a3b8" text-anchor="middle">implementação, design, copy, QA, revisão</text>
<text x="541.0" y="319.0" font-size="11" fill="#94a3b8" text-anchor="middle">técnica, planejamento dentro de um design</text>
<text x="541.0" y="333.0" font-size="11" fill="#94a3b8" text-anchor="middle">aprovado</text>
<rect x="756" y="254" width="290" height="104" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="901.0" y="287.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">deep</text>
<text x="901.0" y="305.0" font-size="11" fill="#94a3b8" text-anchor="middle">arquitetura com trade-offs, julgamento de</text>
<text x="901.0" y="319.0" font-size="11" fill="#94a3b8" text-anchor="middle">segurança e privacidade, decisões</text>
<text x="901.0" y="333.0" font-size="11" fill="#94a3b8" text-anchor="middle">irreversíveis, desempate</text>
<rect x="36" y="392" width="290" height="104" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="181.0" y="425.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Sobe para standard</text>
<text x="181.0" y="443.0" font-size="11" fill="#94a3b8" text-anchor="middle">duas falhas, ambiguidade que o briefing</text>
<text x="181.0" y="457.0" font-size="11" fill="#94a3b8" text-anchor="middle">não resolve ou qualquer necessidade de</text>
<text x="181.0" y="471.0" font-size="11" fill="#94a3b8" text-anchor="middle">julgar</text>
<rect x="396" y="392" width="290" height="104" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="541.0" y="432.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Sobe para deep</text>
<text x="541.0" y="450.0" font-size="11" fill="#94a3b8" text-anchor="middle">gate em caminho crítico, decisão</text>
<text x="541.0" y="464.0" font-size="11" fill="#94a3b8" text-anchor="middle">irreversível ou veredictos em conflito</text>
<rect x="756" y="392" width="290" height="104" rx="11" fill="#1b2538" stroke="#94a3b8" stroke-width="1.6"/>
<text x="901.0" y="432.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Desce para standard</text>
<text x="901.0" y="450.0" font-size="11" fill="#94a3b8" text-anchor="middle">depois que a decisão difícil virou ADR ou</text>
<text x="901.0" y="464.0" font-size="11" fill="#94a3b8" text-anchor="middle">especificação escrita</text>
<rect x="36" y="530" width="1010" height="104" rx="11" fill="#251b47" stroke="#a78bfa" stroke-width="1.6"/>
<text x="541.0" y="577.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Regra de ouro</text>
<text x="541.0" y="595.0" font-size="11" fill="#94a3b8" text-anchor="middle">nenhum gate (segurança, privacidade, revisor de alto risco) roda abaixo de standard, mesmo para economizar</text>

<rect x="36" y="659" width="12" height="12" rx="3" fill="#0b2f31" stroke="#2dd4bf" stroke-width="1.4"/>
<text x="54" y="669" font-size="10.5" fill="#94a3b8">guilda (núcleo)</text>
<rect x="165.77499999999998" y="659" width="12" height="12" rx="3" fill="#0e2340" stroke="#60a5fa" stroke-width="1.4"/>
<text x="183.77499999999998" y="669" font-size="10.5" fill="#94a3b8">ferramenta externa</text>
<rect x="313.505" y="659" width="12" height="12" rx="3" fill="#3b1414" stroke="#f87171" stroke-width="1.4"/>
<text x="331.505" y="669" font-size="10.5" fill="#94a3b8">lacuna ou risco</text>
<rect x="443.28" y="659" width="12" height="12" rx="3" fill="#1b2538" stroke="#94a3b8" stroke-width="1.4"/>
<text x="461.28" y="669" font-size="10.5" fill="#94a3b8">dado ou artefato</text>
<rect x="579.04" y="659" width="12" height="12" rx="3" fill="#251b47" stroke="#a78bfa" stroke-width="1.4"/>
<text x="597.04" y="669" font-size="10.5" fill="#94a3b8">segurança e gates</text>
<rect x="720.785" y="659" width="12" height="12" rx="3" fill="#0f2f1d" stroke="#4ade80" stroke-width="1.4"/>
<text x="738.785" y="669" font-size="10.5" fill="#94a3b8">resultado</text>
<text x="36" y="692" font-size="11" fill="#94a3b8">Hoje no guilda: deep = Opus, standard = Sonnet, light = Haiku. Um campo no arquivo gerado não prova que o runtime honrou o modelo.</text>
</svg>
