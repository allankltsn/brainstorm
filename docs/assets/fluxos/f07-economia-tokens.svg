<text x="926.0" y="339.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Confirmar compatibilidade e</text>
<text x="926.0" y="356.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">canônico</text>
<rect x="36" y="404" width="300" height="70" rx="11" fill="#3b1414" stroke="#f87171" stroke-width="1.6"/>
<text x="186.0" y="435.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Reexplicar o projeto a cada</text>
