<text x="556.0" y="243.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Serena (busca e edição por</text>
<text x="556.0" y="260.0" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">símbolo via LSP)</text>
